name: Verify public ARCLINE STG
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-public.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['ARCLINE STG manual publish']
    types: [completed]
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          path: deployment
          persist-credentials: false
      - name: Resolve expected source
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          sha = json.loads(Path('deployment/staging-source.json').read_text())['sourceCommit']
          if not re.fullmatch(r'[0-9a-f]{40}', sha): raise SystemExit('Invalid source pin')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output: output.write('commit=' + sha + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: bittrove88/bittrove88.github.io
          ref: ${{ steps.source.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser dependencies
        working-directory: source/ARCLINE
        run: |
          npm ci
          if [ ! -x /usr/bin/google-chrome ] && [ ! -x /usr/bin/chromium ]; then
            npx playwright install --with-deps chromium
          fi
      - name: Verify actual public URL in an isolated browser profile
        working-directory: source/ARCLINE
        env:
          EXPECTED_SOURCE: ${{ steps.source.outputs.commit }}
          MANUAL_SOURCE_OVERRIDE: ${{ github.event.workflow_run.event == 'workflow_dispatch' }}
          ARCLINE_EVIDENCE_DIR: ${{ runner.temp }}/public-staging-evidence
        run: |
          node <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path');
          const {chromium}=require('playwright');
          const base='https://bittrove88.github.io/arcline-staging/',origin=new URL(base).origin;
          const out=process.env.ARCLINE_EVIDENCE_DIR;fs.mkdirSync(out,{recursive:true});
          (async()=>{
            const executablePath=await require('./game/tools/select_browser.cjs')(out);
            const browser=await chromium.launch({executablePath,args:['--no-sandbox']});
            try{
              const context=await browser.newContext({viewport:{width:844,height:390},reducedMotion:'reduce'});
              const page=await context.newPage(),errors=[],failed=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('response',r=>{if(r.url().startsWith(base)&&r.status()>=400)failed.push(r.url());});
              const response=await page.goto(base+'?verify='+process.env.EXPECTED_SOURCE,{waitUntil:'domcontentloaded'});
              assert.equal(response.status(),200);await page.locator('#stage').waitFor();
              const metadataResponse=await page.request.get(base+'STAGING_BUILD.json?verify='+process.env.EXPECTED_SOURCE);
              assert.equal(metadataResponse.status(),200);
              const metadata=await metadataResponse.json();
              if(process.env.MANUAL_SOURCE_OVERRIDE!=='true')assert.equal(metadata.sourceCommit,process.env.EXPECTED_SOURCE);
              assert.equal(metadata.persistentSave,false);assert.equal(metadata.sourceDirty,false);
              const witnessUrl=origin+'/__arcline_stg_storage_witness';
              await context.route(witnessUrl,route=>route.fulfill({contentType:'text/html',body:'<!doctype html><title>Isolated storage witness</title>'}));
              const witness=await context.newPage();await witness.goto(witnessUrl);
              await witness.evaluate(()=>{localStorage.setItem('arcline-campaign-v1','production-witness');localStorage.setItem('arcline-language','en');localStorage.setItem('arcline-control-layout','right');localStorage.setItem('other-app','keep');});
              const before=await witness.evaluate(()=>JSON.stringify({...localStorage}));
              await context.addInitScript(()=>{
                if(!location.pathname.startsWith('/arcline-staging/game/'))return;
                window.nativeAccesses=[];
                for(const key of ['localStorage','sessionStorage','indexedDB']){
                  const d=Object.getOwnPropertyDescriptor(window,key);
                  Object.defineProperty(window,key,{configurable:true,get(){nativeAccesses.push(key);return d.get.call(window);}});
                }
                window.ytgame=new Proxy({},{get(){nativeAccesses.push('SDK');throw Error('SDK access');}});
              });
              const stages=[];
              for(const stage of [1,50,100]){
                await page.goto(base+'game/?stage='+stage+'&verify='+metadata.sourceCommit,{waitUntil:'domcontentloaded'});
                await page.waitForFunction(()=>document.documentElement.dataset.stagingReady||document.documentElement.dataset.stagingError);
                assert.equal(await page.evaluate(()=>document.documentElement.dataset.stagingError),undefined);
                await page.waitForFunction('save.ready&&!document.getElementById("play").disabled');
                assert.equal(await page.evaluate(()=>ArcStaging.sourceCommit),metadata.sourceCommit);
                assert.equal(await page.evaluate(()=>save.data.cleared),stage-1);
                assert.equal(await page.evaluate(()=>selectedMap),stage-1);
                assert.deepEqual(await page.evaluate(()=>nativeAccesses),[]);
                assert.equal(await page.locator('link[rel=manifest]').count(),0);
                if(stage>1){
                  await page.locator('#play').click();await page.waitForFunction('s!==null');
                  assert.equal(await page.evaluate(()=>s.stage),stage);
                  await page.evaluate(async()=>{ArcI18n.setLanguage('en');toggleControlLayout();save.data.campaignInventory.weapons.W06=7;await save.save();});
                  await page.reload();await page.waitForFunction('document.documentElement.dataset.stagingReady==="true"&&save.ready');
                  assert.equal(await page.evaluate(()=>ArcI18n.language),'ja');
                  assert.equal(await page.evaluate(()=>controlLayout),'left');
                  assert.equal(await page.evaluate(()=>save.data.campaignInventory.weapons.W06===7),false);
                  assert.deepEqual(await page.evaluate(()=>nativeAccesses),[]);
                }
                stages.push(stage);
              }
              const played=await page.evaluate(async()=>{const a=new Audio('assets/audio/bgm/bgm_title.m4a');a.muted=true;await a.play();await new Promise(r=>setTimeout(r,200));const played=a.currentTime>0;a.pause();return played;});
              assert(played,'Public AAC plays');
              await page.screenshot({path:path.join(out,'public-stage-100.png')});
              assert.equal(await witness.evaluate(()=>JSON.stringify({...localStorage})),before);
              assert.deepEqual(errors,[]);assert.deepEqual(failed,[]);
              fs.writeFileSync(path.join(out,'PUBLIC_STAGING.json'),JSON.stringify({status:'PASS',url:base,sourceCommit:metadata.sourceCommit,stages,nativeStorageAccesses:0,productionWitnessUnchanged:true,publicAudio:true,errors,failed,scope:'Actual public URL in a fresh browser profile; no user saves or physical devices accessed.'},null,2));
              console.log('PASS actual public STG',base,metadata.sourceCommit);
              await context.close();
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-staging-evidence
          path: ${{ runner.temp }}/public-staging-evidence
